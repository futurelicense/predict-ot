function stamp(t){try{return new Date(t).toLocaleString()}catch{return t}}function notify(s){let e=document.getElementById('toast');if(e)e.remove();e=document.createElement('div');e.id='toast';e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastId);toastId=setTimeout(()=>e.remove(),3500)}function go(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}function aById(id){return state.assets.find(a=>a.id===id)}function sById(id){return state.scenarios.find(s=>s.id===id)}function serviceByAsset(id){let a=aById(id);return a?state.services.find(s=>s.name===a.service):null}function riskValue(asset){if(!asset)return 0;const m=state.model;let total=m.exposure*asset.exposure/5+m.impact*asset.criticality/5+m.readiness*asset.condition/5;return Math.round(Math.max(0,Math.min(100,total*100)))}function riskTier(v){return v>=80?'Critical':v>=65?'High':v>=45?'Elevated':'Moderate'}function badge(s){let k=/critical|rejected|breach|failed/i.test(s)?'danger':/high|pending|review|warning|not connected/i.test(s)?'warn':/approved|complete|feasible|connected|ready|passed/i.test(s)?'':'blue';return `<span class="tag ${k}">${esc(s)}</span>`}function scenarioRisk(s){let a=aById(s.asset);return Math.round(.6*riskValue(a)+.4*(s.severity/5*100))}function forecastFor(s){let a=aById(s.asset);if(!a)return null;let service=serviceByAsset(a.id);let exposure=(a.exposure+ s.likelihood)/10;let severity=s.severity/5;let confidence=state.model.uncertainty/100;let baseHours=Math.max(1,s.duration*(.55+.45*a.condition/3));let impact=Math.round(service.demand* Math.min(1,exposure*severity*1.5)*baseHours);let recoveryHours=Math.max(1,baseHours-(s.recovery/10));return {score:scenarioRisk(s),index:Math.round(100*exposure*severity),hours:+recoveryHours.toFixed(1),low:+(recoveryHours*(1-confidence)).toFixed(1),high:+(recoveryHours*(1+confidence)).toFixed(1),impact,service,asset:a,breach:recoveryHours>service.rto,confidence};}function forecastRun(sid){let s=sById(sid);if(!s)return;let re function riskStudio(){return h('Exposure & risk modeling studio','Build transparent, risk-informed priority indices using documented asset exposure, service criticality and restoration difficulty. These are not calibrated attack probabilities.')+`<div class="grid"><div class="col4">${panel('Model configuration',`<form id="riskform" class="formgrid"><div class="field full"><label>Exposure weight</label><input name="exposure" type="number" step="0.05" min="0" max="1" value="${fmt(state.model.exposure,2)}"></div><div class="field full"><label>Impact / criticality weight</label><input name="impact" type="number" step="0.05" min="0" max="1" value="${fmt(state.model.impact,2)}"></div><div class="field full"><label>Restoration difficulty weight</label><input name="readiness" type="number" step="0.05" min="0" max="1" value="${fmt(state.model.readiness,2)}"></div><div class="field full"><label>Scenario uncertainty band (%)</label><input name="uncertainty" type="number" min="5" max="60" value="${state.model.uncertainty}"></div><div class="field full"><button class="btn primary" type="submit">Save new model version</button></div></form><div class="divider"></div><div class="labelvalue"><span>Model version</span><strong>v${state.model.version}</strong></div><div class="note">Weights are normalized before scoring. Results support research prioritization only.</div>`)}</div><div class="col8">${panel('Risk profile by asset',state.assets.length?`<div class="tablewrap"><table><thead><tr><th>Asset</th><th>Exposure</th><th>Criticality</th><th>Restore difficulty</th><th>Priority score</th><th>Class</th></tr></thead><tbody>${[...state.assets].sort((a,b)=>riskValue(b)-riskValue(a)).map(a=>`<tr><td><strong>${esc(a.id)}</strong> ${esc(a.name)}</td><td>${a.exposure}/5</td><td>${a.criticality}/5</td><td>${a.condition}/5</td><td><strong>${riskValue(a)}</strong></td><td>${badge(riskTier(riskValue(a)))}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div><div class="col12">${panel('Computational method & distinction',`<div class="code">PriorityIndex(a) = 100 × [w₁ × exposure(a)/5 + w₂ × criticality(a)/5 + w₃ × restoreDifficulty(a)/5]\nΣ weights = 1.0\n\nRisk score ≠ exploitation probability. CVE presence ≠ verified local vulnerability.\nForecast duration is a separate scenario-based calculation.</div>`)}</div></div>`}
function dependencies(){return h('Cyber-physical dependency explorer','Trace synthetic asset-to-service relationships and highlight recovery objectives. A real deployment would require authorized topology verification.')+`<div class="grid"><div class="col12">${panel('Service dependency graph',state.assets.length?network():blankPanel(),`<span class="sourcebadge">SYNTHETIC TOPOLOGY</span>`)}</div><div class="col7">${panel('Services and continuity objectives',`<div class="tablewrap"><table><thead><tr><th>Service</th><th>Dependent assets</th><th>Criticality</th><th>RTO</th></tr></thead><tbody>${state.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.assets.length}</td><td>${s.criticality}/5</td><td><strong>${s.rto}h</strong></td></tr>`).join('')}</tbody></table></div>`)}</div><div class="col5">${panel('Interpretation',`<div class="note">Arrows show declared synthetic dependencies only. No unknown dependency or cyber-physical propagation path is assumed to be verified.</div><div class="divider"></div><div class="labelvalue"><span>Service nodes</span><strong>${state.services.length}</strong></div><div class="labelvalue"><span>Asset nodes</span><strong>${state.assets.length}</strong></div><div class="labelvalue"><span>Recorded dependency edges</span><strong>${state.assets.filter(a=>state.services.some(s=>s.name===a.service)).length}</strong></div>`)}</div></div>`}
function forecastPage(){let f=state.forecastRuns[0],s=sById(state.activeScenario);return h('Disruption & recovery forecasting','Estimate simulated service impact and recovery duration using explicit assumptions. Distinguish research indices, scenario bands and validated operational outcomes.')+`<div class="toolbar"><select id="scenario-picker" class="compact" style="max-width:350px">${state.scenarios.map(x=>`<option value="${x.id}" ${x.id===state.activeScenario?'selected':''}>${esc(x.name)}</option>`)}</select><button class="btn primary" data-action="runforecast" ${!s?'disabled':''}>Run predictive scenario</button><button class="btn" data-go="Scenario Laboratory">Edit assumptions</button></div><div class="grid">${s?(()=>{let calc=forecastFor(s);return tMetric('Risk priority score',calc.score+'/100','Index, not attack probability','#b9854b')+tMetric('Recovery estimate',calc.hours+' h','Scenario-derived median','#128d91')+tMetric('Scenario interval',calc.low+'–'+calc.high+' h','Assumption-based range','#6f77ad')+tMetric('Continuity objective',calc.service.rto+' h',calc.breach?'RTO breach estimated':'Within modeled RTO','#c16e61')})():''}<div class="col8">${panel('Recovery forecast sensitivity',s?(()=>{let c=forecastFor(s);return chart([.9,1.1,.95,1.2,1.08,1.3,1.15,1.4].map(x=>+(x*c.hours).toFixed(1)),['T1','T2','T3','T4','T5','T6','T7','T8'])+'<div class="muted tiny">Illustrative sensitivity curve around the active scenario, not a validated time-series prediction.</div>'})():blankPanel())}</div><div class="col4">${panel('Current scenario explanation',s?(()=>{let c=forecastFor(s);return `<div class="labelvalue"><span>Scenario</span><strong>${esc(s.name)}</strong></div><div class="labelvalue"><span>Critical service</span><strong>${esc(c.service.name)}</strong></div><div class="labelvalue"><span>Service RTO</span><strong>${c.service.rto} h</strong></div><div class="labelvalue"><span>Recovery interval</span><strong>${c.low}–${c.high} h</strong></div><div class="labelvalue"><span>Weighted service loss</span><strong>${fmt(c.impact,0)} units</strong></div><div class="note ${c.breach?'warn':''}">${c.breach?'Modeled recovery exceeds the service RTO. Prioritize safe readiness measures and review dependencies.':'Modeled recovery does not exceed the stated RTO. No assurance of real facility readiness is implied.'}</div>`})():blankPanel())}</div><div class="col12">${panel('Saved forecast runs',state.forecastRuns.length?`<div class="tablewrap"><table><thead><tr><th>Run</th><th>Scenario</th><th>Model version</th><th>Recovery estimate</th><th>Interval</th><th>Time</th></tr></thead><tbody>${state.forecastRuns.slice(0,10).map(f=>`<tr><td>${f.id}</td><td>${esc(f.scenario)}</td><td>v${f.modelVersion}</td><td><strong>${f.hours}h</strong></td><td>${f.low}–${f.high}h</td><td>${stamp(f.created)}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div></div>`}
function scenarios(){return h('Scenario laboratory','Create synthetic cyber-OT disruption cases, vary impact and restoration assumptions, and send chosen scenarios into the forecast and optimization workflow.')+`<div class="grid"><div class="col8">${panel('Scenario portfolio',state.scenarios.length?`<div class="tablewrap"><table><thead><tr><th>Scenario / asset</th><th>Severity</th><th>Recovery setting</th><th>Priority</th><th></th></tr></thead><tbody>${state.scenarios.map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="muted tiny">${esc(s.asset)} · ${esc(aById(s.asset)?.sector||'')}</div></td><td>${s.severity}/5</td><td>${s.recovery}/10</td><td>${badge(riskTier(scenarioRisk(s)))}</td><td><button class="btn small" data-usescenario="${s.id}">Select</button></td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div><div class="col4">${panel('Create simulation scenario',`<form id="scenarioform" class="formgrid"><div class="field full"><label>Scenario title</label><input name="name" required placeholder="e.g. Backup telemetry unavailable"></div><div class="field full"><label>Asset</label><select name="asset" required>${state.assets.map(a=>`<option value="${a.id}">${esc(a.id+' · '+a.name)}</option>`)}</select></div><div class="field"><label>Impact severity (1–5)</label><input name="severity" type="number" min="1" max="5" value="4"></div><div class="field"><label>Likelihood assumption (1–5)</label><input name="likelihood" type="number" min="1" max="5" value="3"></div><div class="field"><label>Unmitigated hours</label><input name="duration" type="number" min="1" max="168" value="8"></div><div class="field"><label>Recovery readiness (1–10)</label><input name="recovery" type="number" min="1" max="10" value="5"></div><div class="field full"><label>Owner (simulated)</label><input name="owner" required value="OT resilience team"></div><div class="field full"><button class="btn primary" type="submit">+ Create scenario</button></div></form>`)}</div><div class="col12">${panel('Scenario assumptions & limitations',`<div class="note">Input scores are researcher-defined and do not represent attack telemetry, an observed cyber incident, or a real industrial network. No exploit chains or live OT controls are modeled.</div>`)}</div></div>`}
function optimization(){let latest=state.optimRuns[0];return h('Recovery resource optimization','Solve a constrained synthetic portfolio selection problem. Evaluate preparedness and restoration planning actions within staff-hour and budget limits.')+`<div class="grid"><div class="col4">${panel('Capacity & cost constraints',`<form id="optform" class="formgrid"><div class="field full"><label>Available budget ($ thousands)</label><input name="budget" type="number" min="0" max="1000" value="${state.optimization.budget}"></div><div class="field full"><label>Available team-hours</label><input name="hours" type="number" min="0" max="1000" value="${state.optimization.hours}"></div><div class="field full"><button type="submit" class="btn primary">⚙ Calculate optimal portfolio</button></div></form><div class="divider"></div><div class="note">Exact enumeration selects the highest scenario benefit score within both limits. Benefits are illustrative planning units and are not proven risk reduction.</div>`)}</div><div class="col8">${panel('Candidate preparedness and recovery actions',`<div class="tablewrap"><table><thead><tr><th>Action</th><th>Type</th><th>Cost</th><th>Hours</th><th>Modeled benefit</th></tr></thead><tbody>${state.actions.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.category)}</td><td>${money(a.cost)}</td><td>${a.hours} h</td><td>${a.benefit} units</td></tr>`).join('')}</tbody></table></div>`)}</div>${latest?`<div class="col12">${panel('Latest computed portfolio',`<div class="grid"><div class="col3">${panel('Benefit index',`<div class="metricvalue">${latest.benefit}</div><div class="tiny muted">Illustrative units</div>`)}</div><div class="col3">${panel('Total cost',`<div class="metricvalue">${money(latest.cost)}</div><div class="tiny muted">Of ${money(latest.budget)} available</div>`)}</div><div class="col3">${panel('Staff hours',`<div class="metricvalue">${latest.hours}</div><div class="tiny muted">Of ${latest.hourLimit} available</div>`)}</div><div class="col3">${panel('Solver result',`<div class="metricvalue" style="font-size:18px">Feasible</div><div class="tiny muted">${esc(latest.solver)}</div>`)}</div></div><div class="divider"></div><h3>Selected actions</h3><div class="two">${latest.selected.map(id=>{let x=state.actions.find(a=>a.id===id);return `<div class="recoverytask"><strong>${esc(x.name)}</strong><div class="tiny muted">${money(x.cost)} · ${x.hours} team-hours · ${x.benefit} benefit units</div></div>`}).join('')}</div><div class="toolbar"><button class="btn primary" data-action="submitreview">Submit portfolio for human review</button><button class="btn" data-go="Governance & Audit">View review queue</button></div>`)}</div>`:''}<div class="col12">${panel('Optimization constraints & solver explanation',`<div class="code">maximize Σ benefitᵢ × selectionᵢ\nsubject to Σ costᵢ × selectionᵢ ≤ budget\n           Σ hoursᵢ × selectionᵢ ≤ team_hours\n           selectionᵢ ∈ {0,1}\n\nHard safety gates: this application does not execute any OT command, network change or restoration operation.</div>`)}</div></div>`}
function playbooks(){return h('Reviewed recovery playbooks','Convert approved planning portfolios into simulation-only checklists. Any actual restoration, isolation or change requires separate operational authorization.')+`<div class="toolbar"><button class="btn primary" data-action="createplaybook">+ Create playbook from approval</button><button class="btn" data-go="Governance & Audit">Review decisions</button></div><div class="grid"><div class="col8">${state.playbooks.length?state.playbooks.map(p=>{let s=sById(p.scenario);return `<div class="panel" style="margin-bottom:14px"><div class="panelhead"><h3>${esc(s?.name||p.scenario)}</h3>${badge(p.status)}</div><p class="tiny muted">${esc(p.id)} · Human review ${esc(p.review)} · Created ${stamp(p.when)}</p>${p.tasks.map(t=>{let a=state.actions.find(a=>a.id===t.id);return `<div class="listrow"><label class="checkline"><input type="checkbox" data-checktask="${p.id}|${t.id}" ${t.done?'checked':''}><span>${esc(a?.name||t.id)}</span></label>${t.done?badge('Completed'):badge('Open')}</div>`}).join('')}<div class="toolbar"><button class="btn primary" data-exercise="${p.id}" ${!p.tasks.every(t=>t.done)?'disabled':''}>Record synthetic exercise outcome</button></div></div>`}).join(''):panel('No approved recovery plan',`<div class="empty"><strong>No playbooks yet</strong>Run optimization, submit a portfolio and record an approval before generating the simulation checklist.</div>`)}</div><div class="col4">${panel('Safety and change-control boundary',`<div class="stack"><div class="note red">Simulation checkboxes do not execute commands, configure devices, patch assets, isolate networks, or restore critical services.</div><div class="note">A real-world playbook must be approved, site-specific and controlled by authorized OT operators, including safety and operational interlocks.</div></div>`)}</div></div>`}
function exercises(){let ex=state.exercises;return h('Exercises & resilience outcomes','Record repeatable synthetic tabletop outcomes and compare scenario projections with simulated restoration performance.')+`<div class="toolbar"><button class="btn" data-go="Recovery Playbooks">Review simulation playbooks</button><button class="btn" data-go="Validation Laboratory">Evaluate model</button></div><div class="grid">${tMetric('Exercises recorded',ex.length,'Synthetic tabletop only','#138d92')}${tMetric('Within RTO',ex.filter(x=>x.withinRto).length,'Scenario results','#378e64')}${tMetric('RTO breaches',ex.filter(x=>!x.withinRto).length,'Indicative only','#b37a39')}${tMetric('Average recovery',ex.length?fmt(ex.reduce((a,b)=>a+b.simulatedRecovery,0)/ex.length)+' h':'—','Synthetic outcome','#687db7')}<div class="col12">${panel('Exercise outcome log',ex.length?`<div class="tablewrap"><table><thead><tr><th>Exercise</th><th>Scenario</th><th>Predicted</th><th>Simulated outcome</th><th>Service RTO</th><th>Result</th></tr></thead><tbody>${ex.map(x=>`<tr><td>${x.id}<div class="muted tiny">${stamp(x.when)}</div></td><td>${esc(sById(x.scenario)?.name||x.scenario)}</td><td>${x.forecastHours}h</td><td><strong>${x.simulatedRecovery}h</strong></td><td>${x.serviceRto}h</td><td>${badge(x.withinRto?'Within RTO':'Breach')}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div><div class="col12">${panel('Outcome integrity',`<div class="note warn">Simulated improvement is a deterministic demonstration value based on the number of selected preparations. It is not an observed recovery time or measured effectiveness of any real intervention.</div>`)}</div></div>`}
function validation(){let r=state.exercises;let errors=r.map(x=>Math.abs(x.simulatedRecovery-x.forecastHours));let mae=r.length?errors.reduce((a,b)=>a+b,0)/r.length:null;let rmse=r.length?Math.sqrt(r.reduce((a,x)=>a+(x.simulatedRecovery-x.forecastHours)**2,0)/r.length):null;return h('Model validation laboratory','Inspect evidence quality, numerical consistency, simulated exercise errors and limits of generalization. Research prototype validation is not production OT validation.')+`<div class="grid">${tMetric('Forecast runs',state.forecastRuns.length,'Saved scenario projections','#148f94')}${tMetric('Synthetic evaluations',r.length,'Tabletop records only','#597fa4')}${tMetric('Mean absolute error',mae===null?'N/A':fmt(mae,2)+'h','Synthetic forecast error','#9e77a7')}${tMetric('RMSE',rmse===null?'N/A':fmt(rmse,2)+'h','Synthetic forecast error','#ac864a')}<div class="col8">${panel('Predicted versus simulated recovery',r.length?chart(r.map(x=>x.simulatedRecovery),r.map((_,i)=>'E'+(i+1))):blankPanel())}</div><div class="col4">${panel('Evaluation readiness checklist',`<div class="stack">${[['Data provenance','Public and synthetic sources distinguished'],['Calibration','Priority index not calibrated'],['Holdout assessment','Independent OT data not available'],['Recovery error','Synthetic-only metrics'],['Safety gate','No live control functionality'],['Reproducibility','Saved runs and inputs']].map(x=>`<div class="listrow"><span><strong>${x[0]}</strong><div class="tiny muted">${x[1]}</div></span>${badge(x[0]==='Calibration'||x[0]==='Holdout assessment'?'Pending':'Documented')}</div>`).join('')}</div>`)}</div><div class="col12">${panel('Validity threats',`<div class="note warn">Public vulnerability catalogs cannot verify a facility’s configuration. Synthetic networks and tabletop outcomes may not generalize to real industrial processes. No performance or national resilience benefit is claimed without independent sector-specific pilots.</div>`)}</div></div>`}
function governance(){return h('Governance & accountability center','Maintain review gates, documented approvals, research audit history, model versioning and simulation-only operational boundaries.')+`<div class="toolbar"><button class="btn" data-go="Recovery Optimization">Prepare a portfolio</button><button class="btn" data-action="exportaudit">Export audit CSV</button><button class="btn" data-action="backup">Export workspace backup</button></div><div class="grid"><div class="col7">${panel('Human review queue',state.reviews.length?`<div class="tablewrap"><table><thead><tr><th>Submission</th><th>Scenario</th><th>Status</th><th>Decision</th></tr></thead><tbody>${state.reviews.map(r=>`<tr><td>${r.id}<div class="muted tiny">${stamp(r.created)}</div></td><td>${esc(sById(r.scenario)?.name||r.scenario)}</td><td>${badge(r.status)}</td><td>${r.status==='Under Review'?`<div class="btnrow"><button class="btn small primary" data-decision="${r.id}|Approved">Approve</button><button class="btn small red" data-decision="${r.id}|Rejected">Reject</button></div>`:`<span class="tiny muted">${esc(r.reason)}</span>`}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div><div class="col5">${panel('Governance guardrails',`<div class="stack"><div class="note">Approval is required before a modeled portfolio is represented as a simulated recovery playbook.</div><div class="note warn">Browser-local identity, logs and approvals are demonstration controls, not immutable audit storage or enterprise authentication.</div><div class="labelvalue"><span>Model configuration</span><strong>v${state.model.version}</strong></div><div class="labelvalue"><span>Research mode</span><strong>${state.mode}</strong></div><div class="labelvalue"><span>AI connection</span><strong>Offline</strong></div></div>`)}</div><div class="col12">${panel('Event history',state.audit.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Action</th><th>Details</th><th>Actor</th></tr></thead><tbody>${state.audit.slice(0,35).map(a=>`<tr><td>${stamp(a.when)}</td><td><strong>${esc(a.type)}</strong></td><td>${esc(a.details)}</td><td>${esc(a.actor)}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div></div>`}
function reports(){let latest=state.reports[0];return h('Reports & evidence packages','Create source-traceable research summaries, export JSON/CSV and assemble reproducibility notes from the workspace’s actual simulation records.')+`<div class="grid"><div class="col4">${panel('Publication configuration',`<div class="field"><label>Report template</label><select id="reporttype">${['Risk and resilience brief','Recovery planning summary','Scenario evaluation','Model verification note','Public-data integration status'].map(x=>`<option ${x===ui.reportType?'selected':''}>${x}</option>`)}</select></div><div class="toolbar"><button class="btn primary" data-action="generatereport">Generate report</button><button class="btn" data-action="backup">Export research workspace</button></div><div class="note">Reports retain the distinction between synthetic estimates, public source references and absent live integration evidence.</div>`)}</div><div class="col8">${panel('Latest generated report',latest?`<div class="code" style="min-height:260px;background:#f5f9fa;color:#234254;border:1px solid #dce8e9">${esc(latest.body)}</div><div class="toolbar"><button class="btn primary" data-action="downloadreport">Download .txt</button><button class="btn" data-action="print">Print current view</button></div>`:blankPanel())}</div><div class="col12">${panel('Report archive',state.reports.length?`<div class="tablewrap"><table><thead><tr><th>Report</th><th>Generated</th><th>ID</th><th>Data classification</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${esc(r.title)}</td><td>${stamp(r.when)}</td><td>${r.id}</td><td>${badge(state.mode==='demo'?'Synthetic':'Research')}</td></tr>`).join('')}</tbody></table></div>`:blankPanel())}</div></div>`}
function copilot(){let f=state.forecastRuns[0],o=state.optimRuns[0];let prompts=['Summarize the current cyber-OT risk posture','Explain the latest forecast and RTO gap','Explain the latest recovery portfolio','What evidence gaps limit real-world adoption?'];return h('Groq cyber-resilience advisory copilot','Source-aware explanations of the local research workspace. Offline mode uses deterministic analytical summaries; live Groq calls require a separately configured secure gateway.')+`<div class="grid"><div class="col8">${panel('Ask PREDICT-OT',`<div class="note">Offline research assistant is active. It reads only existing synthetic workspace data, never controls OT equipment and does not send information to an external provider.</div><div class="toolbar">${prompts.map((p,i)=>`<button class="btn small" data-ask="${i}">${esc(p)}</button>`).join('')}</div><form id="aiform"><div class="field"><label>Research question</label><textarea name="query" required placeholder="Ask about risk models, disruption forecasts, evidence gaps or recovery resources"></textarea></div><div class="toolbar"><button class="btn primary" type="submit">Explain using workspace data</button></div></form><div id="aianswer">${state.comments.length?`<div class="result"><h4>Latest explanation · offline research mode</h4><div style="white-space:pre-wrap;line-height:1.7">${esc(state.comments[0].answer)}</div><div class="tiny muted" style="margin-top:9px">${stamp(state.comments[0].when)}</div></div>`:''}</div>`)}</div><div class="col4">${panel('AI integration boundaries',`<div class="labelvalue"><span>Groq connection</span>${badge('Not connected')}</div><div class="labelvalue"><span>Offline explanation</span>${badge('Ready')}</div><div class="labelvalue"><span>Forecast engine</span><strong>Local numerical model</strong></div><div class="labelvalue"><span>Current workspace</span><strong>${esc(state.name)}</strong></div><div class="divider"></div><div class="note warn">Never store a Groq API key in this browser prototype. Production integration: frontend → authenticated gateway → approved tool results → Groq → human reviewer.</div><div class="divider"></div><div class="tiny muted">Groq documentation: <a href="https://console.groq.com/docs/" target="_blank" rel="noopener">console.groq.com/docs</a>.</div>`)}</div><div class="col12">${panel('Allowed future AI tools',`<div class="stepflow">${[['get_asset_profile','Asset inventory lookup'],['get_risk_run','Model explanation'],['get_forecast_run','Recovery estimate interpretation'],['get_review_status','Human approval trace']].map(x=>`<div class="step"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div>`)}</div></div>`}
function answerAI(q){let s=sById(state.activeScenario),f=s?forecastFor(s):null,o=state.optimRuns[0],low=q.toLowerCase(),result;if(/forecast|rto|recover|duration|time/.test(low)){result=f?`Active scenario: ${s.name}. Modeled recovery: ${f.hours} hours, with an assumption-based band of ${f.low}–${f.high} hours. Service RTO is ${f.service.rto} hours. ${f.breach?'The scenario indicates a possible RTO gap.':'The scenario is within the stated objective under these assumptions.'} These are synthetic forecasts, not verified recovery times.`:'No scenario selected for forecasting.'}else if(/portfolio|optimi|resource|budget/.test(low)){result=o?`Latest optimization ${o.id} selected ${o.selected.length} preparation actions, modeled benefit index ${o.benefit}, estimated cost ${money(o.cost)} within ${money(o.budget)} and ${o.hours}/${o.hourLimit} staff hours. Selection used exact subset enumeration. Submission requires human review.`:'No computed recovery resource portfolio exists. Run the optimizer first.'}else if(/evidence|data|adoption|validation|deploy/.test(low)){result=`Evidence limitations: public KEV/NVD/MITRE data do not establish site exposure. OT asset and service dependencies require authorized verification. Predictive accuracy, calibrated probabilities, real recovery effectiveness, and partner adoption remain unvalidated. Public connectors are not connected in this offline prototype.`}else{let high=state.assets.filter(a=>riskValue(a)>=65);result=`Workspace ${state.name} contains ${state.assets.length} modeled OT assets across ${state.services.length} services. ${high.length} assets have a high or critical priority index (≥65). This is a weighted research index derived from exposure, criticality, and restoration difficulty. It is not an attack probability or evidence of a live compromise.`}result+='\n\nSource: active local synthetic workspace and documented model configuration. Groq inference was not used.';state.comments.unshift({query:q,answer:result,when:new Date().toISOString()});save('silent');render();notify('Offline explanation generated')}
function settingsBar(){return `<div class="statusbar" style="margin-top:18px"><div><strong>Data mode:</strong> ${state.mode==='demo'?'Synthetic research demonstration':'Blank research workspace'} · <strong>Model:</strong> v${state.model.version} · <strong>Groq:</strong> offline · <strong>Source feeds:</strong> not connected</div><div><button class="btn small" data-action="backup">Backup</button><button class="btn small" data-action="toggleworkspace">${state.mode==='demo'?'Blank workspace':'Load demo'}</button></div></div>`}function footer(){return `<div class="footer">PREDICT-OT V2.0 · Research-grade frontend prototype · Synthetic / user-provided non-sensitive data only. No live industrial control system connection, automated OT response, verified cyber-risk probability, or validated operational recovery outcome. All real-world interventions require authorized OT operators and independent safeguards.</div>`}function render(){let active=page;const groups={};NAV.forEach(([section,name,icon])=>{(groups[section]??=[]).push([name,icon])});let sidebar=`<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">⌁</div><div><div class="brandstrong">PREDICT-OT</div><div class="brandsub">RESILIENCE INTELLIGENCE</div></div></div>${Object.entries(groups).map(([sect,links])=>`<div class="sidegroup"><div class="sidecap">${sect}</div>${links.map(([name,ico])=>`<button class="navitem ${name===active?'active':''}" data-go="${name}"><span class="navico">${ico}</span>${name}</button>`).join('')}</div>`).join('')}<div class="sidefoot">V2.0 · Research prototype<br>Public / synthetic research only<br>Human-governed recovery</div></aside>`;let views={'Command Center':overview,'Data & Sources':sources,'Asset & Service Registry':assets,'Exposure & Risk Studio':riskStudio,'Dependency Explorer':dependencies,'Disruption Forecasting':forecastPage,'Scenario Laboratory':scenarios,'Recovery Optimization':optimization,'Recovery Playbooks':playbooks,'Exercise & Outcomes':exercises,'Validation Laboratory':validation,'Governance & Audit':governance,'Reports & Evidence':reports,'Groq Advisory Copilot':copilot};document.getElementById('root').innerHTML=`<div class="app">${sidebar}<main class="main"><header class="topbar"><div class="flex"><button class="btn mobiletoggle" id="menubtn">☰</button><div class="breadcrumbs">PREDICT-OT / ${esc(page.toUpperCase())}</div></div><div class="topactions"><span class="pill amber">${state.mode==='demo'?'SYNTHETIC DEMO':'RESEARCH'}</span><span class="pill">MODEL v${state.model.version}</span><span class="pill red">OT DISCONNECTED</span></div></header><section class="content">${(views[page]||overview)()}${settingsBar()}${footer()}</section></main></div>`;bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));document.getElementById('menubtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('asset-filter')?.addEventListener('change',e=>{ui.assetFilter=e.target.value;render()});document.getElementById('scenario-picker')?.addEventListener('change',e=>{state.activeScenario=e.target.value;save('silent');render()});document.querySelectorAll('[data-selectasset]').forEach(el=>el.addEventListener('click',()=>{ui.selectedAsset=el.dataset.selectasset;render()}));document.querySelectorAll('[data-riskscenario]').forEach(el=>el.addEventListener('click',()=>{let a=aById(el.dataset.riskscenario);let s={id:uid('SC'),name:'New scenario: '+a.name,asset:a.id,severity:4,likelihood:3,duration:6,recovery:5,owner:'OT research analyst',status:'Draft',created:new Date().toISOString()};state.scenarios.unshift(s);state.activeScenario=s.id;log('Scenario created',s.name);save('Scenario created');go('Scenario Laboratory')}));document.querySelectorAll('[data-usescenario]').forEach(el=>el.addEventListener('click',()=>{state.activeScenario=el.dataset.usescenario;save('silent');go('Disruption Forecasting')}));document.getElementById('assetform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),service=state.services.find(s=>s.name===f.get('service'));if(!service)return notify('Select a known critical service');let a={id:uid('OT').toUpperCase(),name:String(f.get('name')).trim(),sector:String(f.get('sector')),service:String(f.get('service')),criticality:+f.get('criticality'),exposure:+f.get('exposure'),condition:+f.get('condition'),rto:+f.get('rto'),rpo:1,site:String(f.get('site')).trim(),cve:''};state.assets.push(a);service.assets.push(a.id);log('Asset created',a.id);save('Asset registered');render()});document.getElementById('scenarioform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),s={id:uid('SC'),name:String(f.get('name')).trim(),asset:String(f.get('asset')),severity:+f.get('severity'),likelihood:+f.get('likelihood'),duration:+f.get('duration'),recovery:+f.get('recovery'),owner:String(f.get('owner')),status:'Draft',created:new Date().toISOString()};state.scenarios.unshift(s);state.activeScenario=s.id;log('Scenario created',s.name);save('Scenario created');render()});document.getElementById('riskform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);state.model={exposure:+f.get('exposure'),impact:+f.get('impact'),readiness:+f.get('readiness'),uncertainty:+f.get('uncertainty'),version:state.model.version+1};if(!weightedFit())return;log('Risk model versioned','v'+state.model.version);save('Model saved');render()});document.getElementById('optform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);state.optimization.budget=+f.get('budget');state.optimization.hours=+f.get('hours');optimize()});document.getElementById('aiform')?.addEventListener('submit',e=>{e.preventDefault();let q=new FormData(e.target).get('query');answerAI(String(q))});document.querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>answerAI(['Summarize the current cyber-OT risk posture','Explain the latest forecast and RTO gap','Explain the latest recovery portfolio','What evidence gaps limit real-world adoption?'][+b.dataset.ask])));document.querySelectorAll('[data-checktask]').forEach(el=>el.addEventListener('change',()=>{let [p,t]=el.dataset.checktask.split('|');toggleTask(p,t)}));document.querySelectorAll('[data-decision]').forEach(el=>el.addEventListener('click',()=>{let [id,status]=el.dataset.decision.split('|');decision(id,status)}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.action){case 'exportassets':download('predict-ot-assets.csv',csv(state.assets),'text/csv');break;case 'exportaudit':download('predict-ot-audit.csv',csv(state.audit),'text/csv');break;case 'runforecast':forecastRun(state.activeScenario);break;case 'submitreview':submitReview();break;case 'createplaybook':startPlaybook();break;case 'generatereport':report();break;case 'downloadreport':{let r=state.reports[0];if(r)download('PREDICT-OT-'+r.id+'.txt',r.body);break}case 'backup':download('predict-ot-workspace-backup.json',JSON.stringify(state,null,2),'application/json');break;case 'toggleworkspace':setDemo(state.mode==='demo');break;case 'print':window.print();break;}}));document.querySelectorAll('[data-exercise]').forEach(el=>el.addEventListener('click',exercise));document.getElementById('reporttype')?.addEventListener('change',e=>ui.reportType=e.target.value);document.getElementById('assetcsv')?.addEventListener('change',e=>{if(e.target.files?.[0])importAssets(e.target.files[0])});}render();window.PREDICT_OT_TEST={riskValue,forecastFor,optimize,SEED,scenarioRisk,load,reset:()=>{state=clone(SEED);save('silent');render()},state:()=>state};
</script></body></html>
